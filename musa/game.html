<!doctype html>
<html lang="ar"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a1636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جري موسى">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<title>جري البطل موسى</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap">
<style>
/* Single-look game screen: full-viewport canvas with overlay panels */
:root{
  --ink:#2b1408; --sun:#ffb12e; --sun-ink:#3a1a05; --paper:#fff8ec; --veil:rgba(30,14,40,.62);
  --display:"Lalezar","Segoe UI","Tahoma",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#2a1636;color:var(--paper);font-family:var(--display);overflow:hidden;user-select:none;-webkit-user-select:none}
#c{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;inset-inline:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;padding:10px 16px;pointer-events:none;gap:10px}
.pill{background:rgba(43,20,8,.55);border-radius:999px;padding:4px 14px;font-size:1.35rem;line-height:1.3;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc21a 55%,#c98300);display:inline-block}
.pause{pointer-events:auto;border:0;background:rgba(43,20,8,.55);color:var(--paper);font:inherit;font-size:1.2rem;border-radius:999px;width:42px;height:42px;cursor:pointer}
.powers{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);inset-inline-end:16px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.pw{background:rgba(43,20,8,.6);border-radius:12px;padding:3px 10px 6px;font-size:1rem;min-width:7.5rem;text-align:center}
.pw i{display:block;height:5px;border-radius:3px;background:var(--sun);margin-top:3px}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--veil);padding-inline:16px;padding-block:24px;text-align:center}
.panel h1{margin:0;font-weight:400;font-size:clamp(2.6rem,11vw,4.6rem);line-height:1;color:var(--sun);text-shadow:0 4px 0 var(--ink);text-wrap:balance}
.panel p{margin:0;font-size:1.2rem;max-width:32ch;line-height:1.5}
.offer{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);left:50%;transform:translateX(-50%);border:3px solid #fff;background:#e0457b;color:#fff;font:inherit;font-size:1.6rem;padding:.35rem 1.6rem;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:0 5px 0 #9c1f50;animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.offer{animation:none}}
.offer:focus-visible{outline:3px solid #fff;outline-offset:3px}
.skip{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:50%;transform:translateX(-50%);border:0;background:rgba(43,20,8,.6);color:var(--paper);font:inherit;font-size:1.2rem;padding:.3rem 1.4rem;border-radius:999px;cursor:pointer}
.skip:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.panel img{height:min(34vh,280px);filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.btn{border:0;background:var(--sun);color:var(--sun-ink);font:inherit;font-size:1.7rem;padding:.35rem 2.2rem;border-radius:999px;cursor:pointer;box-shadow:0 5px 0 #b86d00}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b86d00}
.btn:focus-visible,.pause:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.help{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:1.05rem;opacity:.95;direction:rtl}
.help b{color:var(--sun);font-weight:400}
.score-big{font-size:2.2rem;color:var(--paper)}
.best{color:var(--sun);font-size:1.3rem}
.btn2{border:2px solid var(--sun);background:transparent;color:var(--sun);font:inherit;font-size:1.25rem;padding:.2rem 1.4rem;border-radius:999px;cursor:pointer}
.btn2:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.namebox{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(43,20,8,.55);border-radius:16px;padding:12px 14px;width:min(100%,340px)}
.namebox label{font-size:1.15rem;color:var(--paper)}
.namebox .row{display:flex;gap:8px;width:100%}
.namebox input{flex:1;min-width:0;font:inherit;font-size:1.2rem;padding:.3rem .7rem;border-radius:10px;border:2px solid var(--sun);background:var(--paper);color:var(--ink);text-align:right}
.namebox input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.namebox .btn{font-size:1.25rem;padding:.25rem 1.1rem}
.board{width:min(100%,360px);background:rgba(43,20,8,.55);border-radius:16px;padding:8px 6px;max-height:52vh;overflow-y:auto}
.board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.board li{display:grid;grid-template-columns:2rem 1fr auto auto;gap:10px;align-items:center;padding:6px 10px;border-radius:10px;font-size:1.1rem;font-variant-numeric:tabular-nums}
.board li .rk{color:var(--sun);text-align:center}
.board li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.board li .cn{opacity:.8;font-size:.95rem}
.board li.me{background:rgba(255,177,46,.25)}
.board li:nth-child(1) .rk{font-size:1.4rem}
.board .empty{padding:18px;text-align:center;opacity:.85;font-size:1.05rem}
</style>

<canvas id="c" aria-label="لعبة جري البطل موسى"></canvas>
<div class="hud" dir="rtl">
  <div class="pill"><span id="score">0</span> م</div>
  <div class="pill"><span class="coin"></span><span id="coins">0</span></div>
  <button class="pause" id="pauseBtn" type="button" aria-label="إيقاف مؤقت">II</button>
</div>
<div class="powers" id="powers" dir="rtl"></div>
<button class="offer" id="boardOffer" type="button" dir="rtl" hidden>اركب الزلاجة!</button>
<button class="skip" id="skipBtn" type="button" hidden>تخطّي القصة</button>

<div class="panel" id="startPanel" dir="rtl">
  <img id="heroImg" alt="البطل موسى">
  <h1>جري البطل موسى</h1>
  <div class="help">
    <b>اسحب يمين أو شمال</b><span>غيّر الحارة</span>
    <b>اسحب لفوق</b><span>نط فوق الحاجز</span>
    <b>اسحب لتحت</b><span>اتزحلق تحت البوابة</span>
  </div>
  <p>اهرب من عم شحتة، اطلع على البساط والميكروباص، اركب الزلاجة، واجمع العملات!</p>
  <button class="btn" id="startBtn" type="button">ابدأ</button>
  <button class="btn2" id="boardBtn1" type="button">لوحة الأبطال</button>
</div>

<div class="panel" id="overPanel" dir="rtl" hidden>
  <h1 id="overTitle">خبطة!</h1>
  <div class="score-big"><span id="finalScore">0</span> متر · <span id="finalCoins">0</span> عملة</div>
  <div class="best" id="bestLine"></div>
  <div class="namebox" id="nameBox" hidden>
    <label for="nameInput" id="nameLabel">دخلت أحسن 5! اكتب اسمك عشان يتسجل في لوحة الأبطال</label>
    <div class="row"><input id="nameInput" type="text" maxlength="18" autocomplete="off" enterkeyhint="done" placeholder="اسم اللاعب"><button class="btn" id="saveBtn" type="button">سجّل</button></div>
  </div>
  <button class="btn" id="againBtn" type="button">العب تاني</button>
  <button class="btn2" id="boardBtn2" type="button">لوحة الأبطال</button>
</div>

<div class="panel" id="boardPanel" dir="rtl" hidden>
  <h1>لوحة الأبطال</h1>
  <div class="board"><ol id="boardList"></ol></div>
  <button class="btn" id="boardClose" type="button">رجوع</button>
</div>

<div class="panel" id="pausePanel" dir="rtl" hidden>
  <h1>استراحة</h1>
  <button class="btn" id="resumeBtn" type="button">كمّل</button>
</div>

const FONT='"Lalezar","Segoe UI",Tahoma,sans-serif';

/* ---------- view ---------- */
let W,H,dpr,F,HZ;
const CAMY=2.5,PZ=3.6,LANE=1.55,ROADW=2.6,NEAR=0.6;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);F=Math.min(H*0.82,W*1.25);HZ=H*0.88-CAMY*F/PZ}
addEventListener('resize',resize);resize();
let camX=0,camY=CAMY;
function P(x,y,z){const zz=Math.max(z,NEAR);return[W/2+(x-camX)*F/zz,HZ+(camY-y)*F/zz,F/zz]}

/* ---------- state ---------- */
let offers=[],offerT=0,inv=0,state='menu',intro=null,introSeen=false,getUp=0,prevPy=0,carpetUntil={},dist,coins,objs,builds,lane,px,py,vy,slideT,nextRow,shake,tAll,particles,pw,chaser,banner,nextMile,nextPower,stride,best=0,combo,comboT;

  pw={magnet:0,star:0,boots:0,board:0};inv=0;banner=null;nextMile=500;nextPower=160+Math.random()*120;offers=[300+Math.random()*150,1000+Math.random()*300];offerT=0;$('boardOffer').hidden=true;
  chaser={z:PZ-0.55,x:0.95,t:0,on:true};
  builds=[];for(const side of[-1,1]){let z=-2;while(z<130){const b=mkBuild(side,z);builds.push(b);z+=b.d+0.4+Math.random()*1.2}}
}
const SHOPS=['ستور ملك','موبايلات ملك','كشري ملك','قهوة ملك','أزياء ملك','صيدلية ملك','عصير ملك','حلواني ملك','ماركت ملك','قهوة آدم','بلايستيشن آدم','جيم آدم','لعب أطفال آدم','ملابس أطفال آدم','ألعاب آدم'];

/* ---------- shopfronts: half Malak, half Adam ---------- */
const SHOPT={cafe:['قهوة','#6b3e1f','#ffd08a'],pharmacy:['صيدلية','#1f8f5a','#eafff4'],mobile:['موبايلات','#1f5fd6','#d6e6ff'],koshary:['كشري','#c8321e','#ffe2a8'],
  fashion:['أزياء','#8a2f7a','#ffe6f6'],store:['ستور','#d9861a','#fff0cf'],sweets:['حلواني','#c0447a','#ffe9f0'],juice:['عصير','#2fa84a','#fff7c0'],
  market:['ماركت','#2a6f9e','#e9f6ff'],ps:['بلايستيشن','#3b2aa8','#c9b8ff'],gym:['جيم','#303640','#ffe08a'],toys:['لعب أطفال','#e0457b','#fff2a8'],kids:['ملابس أطفال','#1fa3b3','#e8fbff']};
const SHOPKEYS=Object.keys(SHOPT);let shopTurn=0;
function mkShop(){shopTurn++;return{type:SHOPKEYS[(Math.random()*SHOPKEYS.length)|0],owner:shopTurn%2?'ملك':'آدم'}}
function shopName(sh){return SHOPT[sh.type][0]+' '+sh.owner}
function storefront(b,xi,s){
  const sh=b.shop,[nm,col,glow]=SHOPT[sh.type];const z0=Math.max(b.z+0.5,NEAR),z1=b.z+b.d-0.5;if(z1<=z0+0.2)return;
  // lit shop opening with glass frames, rolled-up shutter and a coloured fascia band
  quad(P(xi,0.05,z0),P(xi,1.8,z0),P(xi,1.8,z1),P(xi,0.05,z1),glow);
  if(sh.type==='pharmacy'||sh.type==='market'||sh.type==='store'||sh.type==='mobile'){for(const y of[.55,.95,1.35])quad(P(xi,y,z0),P(xi,y+.05,z0),P(xi,y+.05,z1),P(xi,y,z1),'rgba(60,50,40,.35)')}
  if(sh.type==='fashion'||sh.type==='kids'){for(let z=z0+.6;z<z1-.3;z+=1.4){quad(P(xi,.1,z),P(xi,1.25,z),P(xi,1.25,z+.25),P(xi,.1,z+.25),'rgba(40,30,40,.55)');const hd=P(xi,1.4,z+.12);ctx.fillStyle='rgba(40,30,40,.55)';ctx.beginPath();ctx.arc(hd[0],hd[1],hd[2]*.12,0,7);ctx.fill()}}
  for(let z=z0;z<=z1+.01;z+=1.3){const zz=Math.min(z,z1);quad(P(xi,0.05,zz),P(xi,1.8,zz),P(xi,1.8,zz+.07),P(xi,0.05,zz+.07),'#3a3a40')}
  quad(P(xi,1.62,z0),P(xi,1.8,z0),P(xi,1.8,z1),P(xi,1.62,z1),'#8b8f96');
  quad(P(xi,1.8,z0),P(xi,2.3,z0),P(xi,2.3,z1),P(xi,1.8,z1),col);
  // striped awning for food shops and the café
  if(sh.type==='cafe'||sh.type==='juice'||sh.type==='koshary'||sh.type==='market'||sh.type==='sweets'){let k=0;for(let z=z0;z<z1;z+=.6,k++){const za=Math.min(z+.6,z1);
    quad(P(xi,2.25,z),P(xi-s*.9,1.85,z),P(xi-s*.9,1.85,za),P(xi,2.25,za),k%2?'#f4efe6':col)}}
  // props on the pavement
  const px0=s*(ROADW+0.7);
  if(sh.type==='cafe'){for(let z=z0+.8;z<z1-.4;z+=1.7){if(z<NEAR+.3)continue;const t=P(px0,.75,z),u=t[2];
      ctx.fillStyle='#5a3a22';ctx.fillRect(t[0]-u*.03,t[1],u*.06,u*.75);ctx.fillStyle='#d9c3a0';ctx.beginPath();ctx.ellipse(t[0],t[1],u*.28,u*.07,0,0,7);ctx.fill();
      for(const dx of[-.42,.42]){const c=P(px0+dx,0,z);ctx.fillStyle='#7a4a26';ctx.fillRect(c[0]-u*.14,c[1]-u*.45,u*.28,u*.06);ctx.fillRect(c[0]-u*.13,c[1]-u*.45,u*.04,u*.45);ctx.fillRect(c[0]+u*.09,c[1]-u*.45,u*.04,u*.45);ctx.fillRect(c[0]+(dx<0?-u*.14:u*.1),c[1]-u*.9,u*.04,u*.48)}
      const g=P(px0+.08,.8,z);ctx.fillStyle='#c0392b';ctx.fillRect(g[0]-u*.03,g[1]-u*.1,u*.06,u*.1)}}
  if(sh.type==='toys'){const bz=z0+.6;if(bz>NEAR+.3){const base=P(px0,1.2,bz),u=base[2];const cs=['#ff4d6d','#ffd23f','#4dabf7','#69db7c','#b197fc'];
      cs.forEach((c,i)=>{const bx=base[0]+(i-2)*u*.16,by=base[1]-u*(.55+((i*37)%5)*.06);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(base[0],base[1]);ctx.lineTo(bx,by);ctx.stroke();ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(bx,by,u*.1,u*.13,0,0,7);ctx.fill()})}}
  if(sh.type==='juice'||sh.type==='market'){for(let z=z0+.5;z<z1-.4;z+=1.2){if(z<NEAR+.3)continue;const c=P(px0+s*.35,.3,z),u=c[2];ctx.fillStyle='#a0703c';ctx.fillRect(c[0]-u*.22,c[1]-u*.0,u*.44,u*.3);
      ctx.fillStyle=sh.type==='juice'?'#ff9f1c':'#e63946';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(c[0]-u*.15+i*u*.1,c[1]-u*.02,u*.06,0,7);ctx.fill()}}}
  // projecting light-box sign, facing down the street so it can be read
  const zs=b.z+0.9;if(zs<NEAR+.3)return;
  const A=P(xi,3.15,zs),B=P(xi-s*1.75,2.45,zs);const x0=Math.min(A[0],B[0]),x1=Math.max(A[0],B[0]),y0=A[1],y1=B[1],w=x1-x0,hh=y1-y0;if(w<4)return;
  ctx.fillStyle='#2b2b2b';ctx.fillRect(s<0?x1:x0-hh*.08,y0+hh*.15,hh*.08,hh*.7);
  ctx.fillStyle=col;ctx.fillRect(x0,y0,w,hh);ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,hh*.06);ctx.strokeRect(x0+hh*.06,y0+hh*.06,w-hh*.12,hh-hh*.12);
  let tx=x0+w/2,tw=w*.86;
  if(sh.type==='pharmacy'){const cx=x0+hh*.42,cy=y0+hh/2,c=hh*.16;ctx.fillStyle='#7dff9e';ctx.fillRect(cx-c/2,cy-c*1.5,c,c*3);ctx.fillRect(cx-c*1.5,cy-c/2,c*3,c);tx=x0+hh*.8+(w-hh*.8)/2;tw=(w-hh*.8)*.9}
  ctx.save();ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';const t=shopName(sh);let fs=hh*.52;ctx.font=`${fs}px ${FONT}`;const m=ctx.measureText(t).width;if(m>tw){fs*=tw/m;ctx.font=`${fs}px ${FONT}`}
  ctx.fillStyle='#fff';ctx.fillText(t,tx,y0+hh*.54);ctx.restore()}
function mkBuild(side,z){const brick=Math.random()<.28;return{side,z,d:5+Math.random()*6,h:5+Math.random()*7,w:3+Math.random()*2,
  col:brick?'#a65a3c':BCOL[(Math.random()*BCOL.length)|0],brick,seed:Math.random()*1e5|0,
  shop:mkShop(),plate:false,
  awn:['#2f8f5b','#d64545','#2f6fd6','#e2a02a'][(Math.random()*4)|0]}}

/* ---------- spawning ---------- */
function spawnRow(z){
  const lvl=Math.min(1,(speed-13)/20);
  const lanes=[-1,0,1].sort(()=>Math.random()-.5);
  const nObs=Math.random()<0.35+lvl*0.35?2:1;
  let carpetMade=false;
  for(let i=0;i<3;i++){
    const L=lanes[i];
    if(carpetUntil[L]>z){continue}
    if(!carpetMade&&i===nObs&&Math.random()<0.22){carpetMade=true;const len=18+Math.random()*10;objs.push({t:'carpet',lane:L,z,len,h:1.9,seed:Math.random()*1e4|0,pal:(Math.random()*3)|0});
      carpetUntil[L]=z+len+3;for(let k=0;k*2.2<len-5;k++)objs.push({t:'coin',lane:L,x:L*LANE,z:z+4+k*2.2,y:2.6});continue}
    if(i<nObs){
      const r=Math.random();
      if(r<0.3){const moving=Math.random()<0.25+lvl*0.3;objs.push({t:'bus',lane:L,z:moving?z+30:z,len:6.5,v:moving?7:0,h:2.2});if(!moving&&Math.random()<.6)for(let k=0;k<3;k++)objs.push({t:'coin',lane:L,x:L*LANE,z:z+1+k*2,y:2.9})}
      else if(r<0.45)objs.push({t:'tuk',lane:L,z,len:2.2,v:0,h:1.75});
      else if(r<0.75){objs.push({t:'barrier',lane:L,z,len:0.5,h:0.85});if(Math.random()<.55)coinArc(L,z)}
      else objs.push({t:'gate',lane:L,z,len:0.5});
    }else if(nextPower<=0){nextPower=260+Math.random()*200;objs.push({t:'power',kind:['magnet','star','boots'][(Math.random()*3)|0],lane:L,z,y:1.0,x:L*LANE})}
    else if(Math.random()<0.65)coinLine(L,z-6,5);
  }
}
function coinLine(L,z,n){for(let k=0;k<n;k++)objs.push({t:'coin',lane:L,x:L*LANE,z:z+k*1.9,y:0.7})}
function coinArc(L,z){for(let k=-2;k<=2;k++)objs.push({t:'coin',lane:L,x:L*LANE,z:z+k*1.5,y:0.7+1.6*(1-(k*k)/5)})}

function surfaceAt(x,z){let h=0;for(const o of objs){if(Math.abs(o.lane*LANE-x)>0.7)continue;
  if((o.t==='bus'||o.t==='tuk')&&z>=o.z&&z<=o.z+o.len){if(o.h>h)h=o.h;continue}
  if(o.t!=='carpet')continue;
  if(z>=o.z&&z<=o.z+o.len){const r=z<o.z+3?o.h*(z-o.z)/3:o.h;if(r>h)h=r}}return h}
/* ---------- input ---------- */
function move(d){if(state!=='play')return;const nl=Math.max(-1,Math.min(1,lane+d));if(nl===lane)return;
  if(surfaceAt(nl*LANE,PZ)>py+0.6){shake=0.15;sfx('bump');return}lane=nl;sfx('swish')}
function jump(){if(state!=='play')return;if(py<=surfaceAt(px,PZ)+0.02){vy=pw.boots>0?14:11.5;slideT=0;sfx('jump')}}
function slide(){if(state!=='play')return;if(py>surfaceAt(px,PZ)+0.02)vy=-16;slideT=0.75;sfx('swish')}
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=e.key;
  if(['ArrowLeft','a','A'].includes(k))move(-1);else if(['ArrowRight','d','D'].includes(k))move(1);
  else if(['ArrowUp','w','W',' '].includes(k)){jump();e.preventDefault()}else if(['ArrowDown','s','S'].includes(k))slide();
  else if(k==='Escape'||k==='p')togglePause()});
let ts=null;
cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];ts={x:t.clientX,y:t.clientY,done:false};e.preventDefault()},{passive:false});
cv.addEventListener('touchmove',e=>{if(!ts||ts.done)return;const t=e.changedTouches[0];const dx=t.clientX-ts.x,dy=t.clientY-ts.y;
  if(Math.hypot(dx,dy)>26){ts.done=true;swipe(dx,dy)}e.preventDefault()},{passive:false});
cv.addEventListener('touchend',e=>{if(ts&&!ts.done)jump();ts=null;e.preventDefault()},{passive:false});
let ms=null;cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')ms={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'||!ms)return;const dx=e.clientX-ms.x,dy=e.clientY-ms.y;ms=null;if(Math.hypot(dx,dy)>26)swipe(dx,dy);else jump()});
function swipe(dx,dy){if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else slide()}

/* ---------- sound ---------- */
let ac=null;
function tone(f1,f2,dur,type,vol,delay=0){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);const t=ac.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function sfx(n){
  if(n==='coin'){const f=880*Math.pow(1.06,Math.min(combo,12));tone(f,f*1.5,.1,'square',.045)}
  else if(n==='jump')tone(300,620,.18,'triangle',.12);
  else if(n==='swish')tone(500,260,.1,'sine',.06);
  else if(n==='bump')tone(160,90,.12,'square',.08);
  else if(n==='crash')tone(180,40,.45,'sawtooth',.18);
  else if(n==='power'){tone(520,1040,.12,'square',.06);tone(660,1320,.12,'square',.06,.1);tone(880,1760,.18,'square',.06,.2)}
  else if(n==='glass'){try{const len=ac.sampleRate*0.5|0,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
      const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='highpass';f.frequency.value=2200;g.gain.value=.3;src.buffer=buf;src.connect(f);f.connect(g);g.connect(ac.destination);src.start()}catch(e){}
    for(let i=0;i<6;i++)tone(2200+Math.random()*2800,1500+Math.random()*1500,.09,'triangle',.05,i*.045)}
  else if(n==='mile'){tone(660,660,.1,'triangle',.1);tone(880,880,.18,'triangle',.1,.12)}
}

  let html='';for(const k in pw)if(pw[k]>0)html+=`<div class="pw">${PWNAME[k]}<i style="width:${pw[k]/PWDUR[k]*100}%"></i></div>`;

}

const RUGS=[['#9e1b2a','#f2c14e','#1c3f7a','#f7e7c4'],['#1c3f7a','#e8a33d','#9e1b2a','#f7e7c4'],['#2f6b45','#f2c14e','#8a1e2e','#f7e7c4']];

  }
  // tassels at the front edge
  if(o.z>NEAR&&from===o.z){const y=yAt(o.z);for(let i=0;i<9;i++){const tx=x-hw+.08+i*(2*hw-.16)/8;const a=P(tx,y,o.z),b=P(tx,y,o.z-.25);ctx.strokeStyle=cream;ctx.lineWidth=Math.max(1,a[2]*.03);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}}
}
function shadow(x,z,r,y=0){const a=P(x,y,z);ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(a[0],a[1],r*a[2],r*a[2]*.25,0,0,7);ctx.fill()}

function drawBoard(a,air){const u=a[2];ctx.save();ctx.translate(a[0],a[1]-u*0.05);ctx.rotate((lane*LANE-px)*0.1);
  // glow trail
  const g=ctx.createRadialGradient(0,u*.05,1,0,u*.05,u*.6);g.addColorStop(0,'rgba(255,90,170,.45)');g.addColorStop(1,'rgba(255,90,170,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,u*.05,u*.6,u*.18,0,0,7);ctx.fill();
  ctx.fillStyle='#222';for(const wx of[-.28,.28]){ctx.beginPath();ctx.arc(wx*u,-u*.02,u*.055,0,7);ctx.fill()}
  ctx.fillStyle='#b8235e';ctx.beginPath();ctx.roundRect(-.4*u,-.14*u,.8*u,.09*u,.045*u);ctx.fill();
  ctx.fillStyle='#ff5fa2';ctx.beginPath();ctx.roundRect(-.38*u,-.17*u,.76*u,.06*u,.03*u);ctx.fill();
  ctx.fillStyle='#ffd23f';ctx.fillRect(-.06*u,-.17*u,.12*u,.06*u);
  ctx.restore()}

/* ---------- Musa: pose sprites (run cycle, jump, slide, get up) ---------- */
function drawRig(sn,lift,stand){
  // origin: feet, bottom-centre on the spine; drawn in source pixels
  ctx.translate(-76,-452);
  const arm=(w,mirror)=>{ctx.save();if(mirror){ctx.translate(156,0);ctx.scale(-1,1)}
    ctx.translate(146,150);const back=Math.max(0,w),fwd=Math.max(0,-w);
    ctx.rotate(-0.22*back+0.3*fwd);ctx.translate(0,-14*back);ctx.scale(1,1-0.3*back-0.45*fwd);
    ctx.drawImage(RIG.arm,134-146,142-150);ctx.restore()};
  const wR=sn,wL=-sn;
  if(wR<0)arm(wR,false);if(wL<0)arm(wL,true);          // arm swinging forward goes behind the body
  if(stand){ // both feet on the ground: the planted right leg, and its mirror for the left
    for(const m of[false,true]){ctx.save();if(m){ctx.translate(140,0);ctx.scale(-1,1)}
      ctx.beginPath();ctx.rect(70,232,111,220);ctx.clip();ctx.drawImage(RIG.legs,0,0);ctx.restore()}}
  else{ctx.save();if(sn<0){ctx.translate(136,0);ctx.scale(-1,1)}
  ctx.translate(0,232);ctx.scale(1,1-lift);ctx.drawImage(RIG.legs,0,-232);ctx.restore()}
  ctx.drawImage(RIG.torso,0,0);
  if(wR>=0)arm(wR,false);if(wL>=0)arm(wL,true);        // arm swinging back comes toward the camera
}
function drawPlayer(){
  const gh=surfaceAt(px,PZ),air=py>gh+0.03,running=state!=='over';
  shadow(px,PZ,.45*(1-Math.min(.5,(py-gh)/4)),gh);
  const a=P(px,py,PZ);
  let key=null,sy=1;
  if(state==='over'||slideT>0)key='slide';
  else if(air&&!(vy<-3&&py-gh<0.45))key='jump';
  else if(state==='intro'&&intro&&!(intro.t>intro.walkAt))key='stand';
  if(key){const s=SPR[key];if(!s.img.complete||!s.img.naturalWidth)return;
    const hpx=s.h*a[2],wpx=hpx*s.img.naturalWidth/s.img.naturalHeight;
    ctx.save();ctx.translate(a[0],a[1]);if(running)ctx.rotate((lane*LANE-px)*0.1);
    if(key==='jump')ctx.rotate(Math.max(-.12,Math.min(.12,vy*-0.012)));
    ctx.drawImage(s.img,-wpx*s.cx,-hpx,wpx,hpx);ctx.restore()}
  else{if(!RIG.torso.complete||!RIG.legs.complete||!RIG.arm.complete)return;
    const k=RIG.h*a[2]/452;let sn=Math.sin(stride);if(air)sn=0.5;
    const standing=state==='intro'&&intro&&!(intro.t>intro.walkAt);if(standing)sn=Math.sin(tAll*3)*0.12;
    const riding=pw.board>0&&running&&state!=='menu';
    if(riding){drawBoard(a,air);sn=0.18+Math.sin(tAll*2.5)*0.08}
    if(getUp>0)sy=1-getUp*1.6;
    const bob=riding?a[2]*0.16:(standing?0:(!air?Math.abs(Math.cos(stride))*RIG.h*a[2]*0.03:0));
    ctx.save();ctx.translate(a[0],a[1]-bob);if(inv>0&&Math.sin(tAll*30)>0)ctx.globalAlpha=.45;if(running)ctx.rotate((lane*LANE-px)*0.1+sn*0.025);
    ctx.scale(k,k*sy);drawRig(sn,air?0.08:0,standing);ctx.restore()}
  if(pw.boots>0){const g=P(px,gh,PZ);ctx.fillStyle='rgba(80,230,150,.35)';ctx.beginPath();ctx.ellipse(g[0],g[1],g[2]*.4,g[2]*.12,0,0,7);ctx.fill()}
  if(pw.magnet>0){const g=P(px,py+1.0,PZ);ctx.strokeStyle=`rgba(90,160,255,${.35+.25*Math.sin(tAll*8)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(g[0],g[1],g[2]*1.0,0,7);ctx.stroke()}
}

/* ---------- the chaser: عم شحتة in a galabeya waving his slipper ---------- */
function drawChaser(){
  if(!chaser.on||state==='menu'||state==='intro')return;const z=chaser.z;if(z<NEAR-0.3)return;
  const a=drawManBack(chaser.x,z),u=a[2]*1.15;
  const t=chaser.t;let line=null;
  const L=chaser.fromIntro?[[0,3.2,'الشيشة! وحياة امك ما هسيبك!'],[3.6,5.6,'استنى يا واد يا موسى!'],[5.9,7.6,'هتدفع تمن الشيشة!'],[8,9.6,'ماشي... هتروح مني فين!']]
                           :[[0.3,3.6,'وحياة امك ما هسيبك!'],[3.9,5.4,'استنى يا واد يا موسى!'],[5.8,7.4,'ماشي... هتروح مني فين!']];
  for(const l of L)if(t>l[0]&&t<l[1])line=l[2];
  if(line&&state==='play'&&z>NEAR-0.1&&a[1]-1.95*u<H*0.8&&a[0]>-20&&a[0]<W+20)bubble(Math.max(60,Math.min(W-60,a[0])),a[1]-1.95*u,line,Math.max(17,Math.min(26,u*.2)));
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  camX+=(px*0.8-camX)*0.2;camY+=(CAMY+Math.min(py,surfaceAt(px,PZ)+0.6)*0.85-camY)*0.08;
  if(shake>0)ctx.translate((Math.random()-.5)*14*shake,(Math.random()-.5)*14*shake);
  sky();ground();
  const bs=builds.slice().sort((a,b)=>b.z-a.z);for(const b of bs)building(b);
  const list=[];
  for(const o of objs){if(o.z>=100||(o.z+(o.len||0))<=NEAR-0.1)continue;
    if(o.t==='carpet'&&o.z<PZ&&o.z+o.len>PZ){list.push({z:PZ+0.05,c:o,a:PZ,b:o.z+o.len});list.push({z:o.z,c:o,a:o.z,b:PZ})}
    else if((o.t==='bus'||o.t==='tuk')&&o.z<PZ&&o.z+o.len>PZ){list.push({z:PZ+0.05,o,a:PZ,b:o.z+o.len});list.push({z:o.z,o,a:o.z,b:PZ})}
    else list.push({z:o.z,o})}
  list.push({z:PZ,p:true});
  if(state==='intro'&&intro){list.push({z:intro.manZ,man:true});list.push({z:intro.shZ-0.02,sh:true})}
  for(const p of particles)list.push({z:p.z,part:p});
  list.sort((a,b)=>b.z-a.z);
  for(const it of list){if(it.c)drawCarpet(it.c,it.a,it.b);else if(it.p)drawPlayer();else if(it.man)drawIntroMan();else if(it.sh)drawShisha(intro.shX,intro.shZ,intro.rot,intro.broken);
    else if(it.part){const p=it.part;if(p.z<NEAR)continue;const a=P(p.x,p.y,p.z);
      if(p.smoke)ctx.fillStyle=`rgba(235,235,240,${Math.min(.32,p.life*.25)})`;else if(p.c){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.c}else ctx.fillStyle=`rgba(230,210,180,${p.life*1.6})`;
      ctx.beginPath();ctx.arc(a[0],a[1],a[2]*(p.s||.06),0,7);ctx.fill();ctx.globalAlpha=1}
    else if(it.a!==undefined)drawObj(it.o,it.a,it.b);else drawObj(it.o)}
  drawChaser();
  if(state==='intro'&&intro)introBubbles();
  if(state==='play'&&speed>22){ctx.strokeStyle=`rgba(255,255,255,${(speed-22)/40})`;ctx.lineWidth=2;for(let i=0;i<6;i++){const y=HZ+Math.random()*(H-HZ),x=Math.random()<.5?Math.random()*W*.15:W-Math.random()*W*.15;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(x<W/2?-30:30),y+20);ctx.stroke()}}
  if(banner&&state==='play'){const al=Math.min(1,banner.t*2);ctx.save();ctx.globalAlpha=al;ctx.font=`${Math.min(46,W*.09)}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='rtl';
    const y=HZ*0.55;ctx.lineWidth=7;ctx.strokeStyle='#2b1408';ctx.strokeText(banner.text,W/2,y);ctx.fillStyle='#ffb12e';ctx.fillText(banner.text,W/2,y);ctx.restore()}
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state==='play')update(dt);else if(state==='intro')updateIntro(dt);else if(state==='menu'){tAll+=dt;dist+=dt*6;stride+=dt*8}
  if(shake>0)shake=Math.max(0,shake-dt);
  render();requestAnimationFrame(loop)}
reset();state='menu';
requestAnimationFrame(loop);
})();
</script>
